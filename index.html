<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c7a5c">
<title>承認管理｜ログイン</title>
<link rel="stylesheet" href="./css/common.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-wrap {
    width: 100%;
    max-width: 380px;
  }
  .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    box-shadow: 0 4px 16px rgba(44, 122, 92, .3);
    font-size: 34px;
  }
  .app-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
  }
  .app-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .login-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    box-shadow: var(--shadow-md);
  }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .password-row {
    position: relative;
  }
  .password-row input {
    width: 100%;
    padding: 14px 50px 14px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: #fafafa;
    transition: border-color .2s, background .2s;
    -webkit-appearance: none;
  }
  .password-row input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  .toggle-eye {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: var(--tap);
    height: var(--tap);
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .error-msg {
    background: var(--danger-bg);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    display: none;
  }
  .error-msg.show { display: block; }
  .login-btn {
    width: 100%;
    min-height: var(--tap);
    padding: 15px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-top: 18px;
    cursor: pointer;
  }
  .login-btn:disabled { opacity: .6; cursor: not-allowed; }
  .foot {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">🛡️</div>
      <div class="app-name">承認管理</div>
      <div class="app-sub">利用者アプリ申請の承認用</div>
    </div>

    <div class="login-card">
      <form id="loginForm" autocomplete="off" novalidate>
        <label class="form-label" for="password">共有パスワード</label>
        <div class="password-row">
          <input
            id="password"
            type="password"
            inputmode="text"
            autocomplete="current-password"
            autocapitalize="off"
            spellcheck="false"
            placeholder="管理者パスワード"
            required
          >
          <button type="button" class="toggle-eye" id="toggleEye" aria-label="パスワード表示切替">👁</button>
        </div>
        <div class="error-msg" id="errorMsg">パスワードが違います</div>
        <button type="submit" class="login-btn" id="loginBtn">ログイン</button>
      </form>
    </div>

    <div class="foot">© village-support</div>
  </div>

<script type="module">
import { verifyPassword, markAuthenticated, isAuthenticated } from './lib/auth.js';

// 既ログインなら自動で app.html へ
if (isAuthenticated()) {
  location.replace('./app.html');
}

const form = document.getElementById('loginForm');
const pwInput = document.getElementById('password');
const errorEl = document.getElementById('errorMsg');
const btn = document.getElementById('loginBtn');
const toggleEye = document.getElementById('toggleEye');

toggleEye.addEventListener('click', () => {
  const next = pwInput.type === 'password' ? 'text' : 'password';
  pwInput.type = next;
  toggleEye.textContent = next === 'password' ? '👁' : '🙈';
});

pwInput.addEventListener('input', () => {
  errorEl.classList.remove('show');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = pwInput.value;
  if (!pw) {
    errorEl.textContent = 'パスワードを入力してください';
    errorEl.classList.add('show');
    return;
  }
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = '確認中…';
  try {
    const ok = await verifyPassword(pw);
    if (ok) {
      markAuthenticated();
      location.replace('./app.html');
      return;
    }
    errorEl.textContent = 'パスワードが違います';
    errorEl.classList.add('show');
    pwInput.select();
  } catch (ex) {
    console.error(ex);
    errorEl.textContent = '認証中にエラーが発生しました';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

// 初回フォーカス
window.addEventListener('load', () => pwInput.focus());
</script>
</body>
</html>
